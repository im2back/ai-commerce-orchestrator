# ==============================================================================
# APLICAÇÃO
# ==============================================================================

#1 Nome da aplicação utilizado também na identificação dos traces
quarkus.application.name=orchestrator-ai

# ==============================================================================
# OPENAI - AUTENTICAÇÃO E CONEXÃO
# ==============================================================================
# Chave da API da OpenAI
quarkus.langchain4j.openai.api-key=

# Timeout máximo das chamadas para a OpenAI
quarkus.langchain4j.openai.timeout=120s

# ==============================================================================
# OPENAI - MODELO
# ==============================================================================
# Modelo utilizado pela aplicação
quarkus.langchain4j.openai.chat-model.model-name=gpt-5.6-luna

# Utiliza a Responses API (/v1/responses)
quarkus.langchain4j.openai.chat-model.mode=responses

# Nível de esforço de raciocínio do modelo
quarkus.langchain4j.openai.chat-model.reasoning-effort=medium

# Controle de amostragem do modelo
quarkus.langchain4j.openai.chat-model.top-p=
quarkus.vertx.resolver.servers=8.8.8.8,8.8.4.4
# ==============================================================================
# PERSISTENCIA
# ==============================================================================
quarkus.observability.lgtm.enabled=false
quarkus.hibernate-orm.schema-management.strategy=update

quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=123456
quarkus.datasource.jdbc.url=jdbc:mysql://mysql:3306/mercearia2

# ==============================================================================
# LANGCHAIN4J - LOGS DE REQUEST / RESPONSE DA LLM
# ==============================================================================
# Loga requests enviados para a LLM
quarkus.langchain4j.log-requests=true
# Loga responses recebidos da LLM
quarkus.langchain4j.log-responses=true

# ==============================================================================
# OPENTELEMETRY - TRACING
# ==============================================================================

# Habilita geração e exportação de traces
quarkus.otel.traces.enabled=true


# ==============================================================================
# OPENTELEMETRY - LOGS
# ==============================================================================
# Habilita exportação dos logs via OpenTelemetry
quarkus.otel.logs.enabled=true

# ==============================================================================
# MICROMETER - MÉTRICAS
# ==============================================================================
# Habilita o Micrometer
quarkus.micrometer.enabled=true

# Expõe métricas no formato Prometheus
quarkus.micrometer.export.prometheus.enabled=true

# ==============================================================================
# LOGS ESTRUTURADOS - JSON
# ==============================================================================
# Formata os logs do console como JSON
quarkus.log.console.json.enabled=true

# Coloca os campos MDC diretamente na raiz do JSON
# Ex.: event, requestId, conversationId...
quarkus.log.console.json.mdc.flat-fields=true

# OpenTelemetry -> Collector do LGTM
quarkus.otel.exporter.otlp.endpoint=http://lgtm:4318
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.micrometer.export.otlp.url=http://lgtm:4318/v1/metrics
# ==============================================================================
# OBSERVABILITY DEV SERVICES - LGTM
# ==============================================================================
# Tempo máximo para inicialização da stack LGTM em DEV
%dev.quarkus.observability.lgtm.timeout=3m
# Tempo máximo para inicialização dos Dev Services
%dev.quarkus.devservices.timeout=3m

# ==============================================================================
# MCP - LOGS GERAIS / BOOKING SERVER
# ==============================================================================
# Logs das requisições e respostas do MCP booking-server
quarkus.langchain4j.mcp.booking-server.log-requests=true
quarkus.langchain4j.mcp.booking-server.log-responses=true


# ==============================================================================
# MCP CLIENT - USER SERVICE
# ==============================================================================
# Transporte utilizado pelo MCP
quarkus.langchain4j.mcp.user-service.transport-type=streamable-http
# Endpoint do MCP Server
quarkus.langchain4j.mcp.user-service.url=http://user-service:8081/mcp


# Timeout das chamadas ao MCP Server
quarkus.langchain4j.mcp.user-service.timeout=30s

# Logs das requisições e respostas
quarkus.langchain4j.mcp.user-service.log-requests=true
quarkus.langchain4j.mcp.user-service.log-responses=true


# ==============================================================================
# MCP CLIENT - INVENTORY SERVICE
# ==============================================================================
# Transporte utilizado pelo MCP
quarkus.langchain4j.mcp.inventory-service.transport-type=streamable-http
# Endpoint do MCP Server
quarkus.langchain4j.mcp.inventory-service.url=http://inventory-service:8082/mcp

# Timeout das chamadas ao MCP Server
quarkus.langchain4j.mcp.inventory-service.timeout=30s

# Logs das requisições e respostas
quarkus.langchain4j.mcp.inventory-service.log-requests=true
quarkus.langchain4j.mcp.inventory-service.log-responses=true


# ==============================================================================
# HTTP - HOSTS PERMITIDOS
# ==============================================================================
quarkus.http.host-validation.allowed-hosts=localhost,127.0.0.1,host.docker.internal,orchestrator-ai


# RAG - PostgreSQL / PGVector
quarkus.datasource.rag.db-kind=postgresql
quarkus.datasource.rag.username=postgres
quarkus.datasource.rag.password=123456
quarkus.datasource.rag.jdbc.url=jdbc:postgresql://localhost:5432/rag_db


