# ==============================================================================
# APLICAÇÃO
# ==============================================================================

#1 Nome da aplicação utilizado também na identificação dos traces
quarkus.application.name=orchestrator-ai

# ==============================================================================
# OPENAI - AUTENTICAÇÃO E CONEXÃO
# ==============================================================================
# Chave da API da OpenAI
quarkus.langchain4j.openai.api-key=

# Timeout máximo das chamadas para a OpenAI
quarkus.langchain4j.openai.timeout=120s

# ==============================================================================
# OPENAI - MODELO
# ==============================================================================
# Modelo utilizado pela aplicação
quarkus.langchain4j.openai.chat-model.model-name=gpt-5.6-luna

# Utiliza a Responses API (/v1/responses)
quarkus.langchain4j.openai.chat-model.mode=responses

# Nível de esforço de raciocínio do modelo
quarkus.langchain4j.openai.chat-model.reasoning-effort=medium

# Controle de amostragem do modelo
quarkus.langchain4j.openai.chat-model.top-p=

# ==============================================================================
# PERSISTENCIA
# ==============================================================================
quarkus.datasource.db-kind=mysql
quarkus.observability.lgtm.enabled=false

# ==============================================================================
# LANGCHAIN4J - LOGS DE REQUEST / RESPONSE DA LLM
# ==============================================================================
# Loga requests enviados para a LLM
quarkus.langchain4j.log-requests=true
# Loga responses recebidos da LLM
quarkus.langchain4j.log-responses=true

# ==============================================================================
# OPENTELEMETRY - TRACING
# ==============================================================================

# Habilita geração e exportação de traces
quarkus.otel.traces.enabled=true


# ==============================================================================
# OPENTELEMETRY - LOGS
# ==============================================================================
# Habilita exportação dos logs via OpenTelemetry
quarkus.otel.logs.enabled=true

# ==============================================================================
# MICROMETER - MÉTRICAS
# ==============================================================================
# Habilita o Micrometer
quarkus.micrometer.enabled=true

# Expõe métricas no formato Prometheus
quarkus.micrometer.export.prometheus.enabled=true

# ==============================================================================
# LOGS ESTRUTURADOS - JSON
# ==============================================================================
# Formata os logs do console como JSON
quarkus.log.console.json.enabled=true

# Coloca os campos MDC diretamente na raiz do JSON
# Ex.: event, requestId, conversationId...
quarkus.log.console.json.mdc.flat-fields=true

# OpenTelemetry -> Collector do LGTM
quarkus.otel.exporter.otlp.endpoint=http://localhost:4318
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.micrometer.export.otlp.url=http://localhost:4318/v1/metrics

# ==============================================================================
# OBSERVABILITY DEV SERVICES - LGTM
# ==============================================================================
# Tempo máximo para inicialização da stack LGTM em DEV
%dev.quarkus.observability.lgtm.timeout=3m
# Tempo máximo para inicialização dos Dev Services
%dev.quarkus.devservices.timeout=3m


